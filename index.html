<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    html { font-size: 22px; }
    body { font-family: sans-serif; font-size: 18px; line-height: 1.5; }
    input, button { font-size: 1rem; padding: 6px 8px; }
    .msg { margin: 8px 0; padding: 6px; border-radius: 4px; font-size: 1rem; }
    .msg-meta { font-size: 0.85em; color: #888; margin-left: 6px; }
    .msg-action { font-size: 0.85em; color: #06c; cursor: pointer; margin-left: 6px; }
    .msg-action.danger { color: red; }
    .msg-quote { font-size: 0.9em; color: #666; border-left: 3px solid #ccc; padding-left: 6px; margin-bottom: 2px; }
    .date-sep { text-align: center; color: #999; font-size: 0.9em; margin: 10px 0; }
    #typing-indicator { font-size: 0.9em; color: #888; height: 1.4em; }
    #reply-preview { display: none; background: #eee; padding: 6px 10px; font-size: 0.9em; border-left: 3px solid #06c; margin-bottom: 4px; }
    #partner-status { font-size: 0.9em; color: #555; }
    #my-id { font-size: 1.3em; font-weight: bold; }
    #access-log-panel { display: none; border: 1px solid #ccc; padding: 8px; font-size: 0.9em; max-height: 200px; overflow-y: auto; }
    .copied-flash { background: #d4f5d4 !important; }
  </style>
</head>
<body>
<div id="invite-setup" style="display:none; padding:20px;">
  <h3>招待コードを入力してください</h3>
  <input type="text" id="invite-code-input" placeholder="招待コード">
  <button onclick="submitInviteCode()">送信</button>
  <p id="invite-error" style="color:red;"></p>
</div>
<div id="app-container" style="display:none;">

  <div id="font-control" style="position:fixed; top:6px; right:6px; z-index:9999; background:#fff; border:1px solid #ccc; border-radius:8px; padding:4px 6px; display:flex; gap:6px; box-shadow:0 1px 4px rgba(0,0,0,0.15);">
    <button onclick="changeFontSize(-2)" style="font-size:16px; padding:4px 10px;">A-</button>
    <button onclick="changeFontSize(2)" style="font-size:16px; padding:4px 10px;">A+</button>
  </div>
  <script>
    (function() {
      var STORAGE_KEY = 'appFontSize';
      var MIN = 14, MAX = 36;
      function applySize(px) {
        document.documentElement.style.fontSize = px + 'px';
        localStorage.setItem(STORAGE_KEY, px);
      }
      window.changeFontSize = function(delta) {
        var current = parseInt(localStorage.getItem(STORAGE_KEY)) || 22;
        var next = Math.min(MAX, Math.max(MIN, current + delta));
        applySize(next);
      };
      var saved = parseInt(localStorage.getItem(STORAGE_KEY));
      if (saved) applySize(saved);
    })();
  </script>

  <div>自分のID: <span id="my-id"></span></div>
  <div id="partner-status"></div>
  <div id="error" style="color:red; white-space: pre-wrap;"></div>

  <div id="room-setup" style="display:none;">
    <p>ルームの合言葉を入力してください（相手と事前に決めた文字列）</p>
    <input id="room-passphrase-input" type="text" placeholder="ルーム合言葉">
    <button id="room-passphrase-submit">接続</button>
    <p id="room-status"></p>
    <button id="room-reset-btn" style="display:none; color:red;">このルームをリセットして再接続</button>
  </div>

  <div id="partner-setup" style="display:none;">
    <p>相手のUIDを入力してください</p>
    <input id="partner-input" type="text" placeholder="相手のUID">
    <button id="partner-submit">設定</button>
  </div>

  <div id="passphrase-setup" style="display:none;">
    <p>暗号化用の合言葉を入力してください（相手と同じ文字列にすること）</p>
    <input id="passphrase-input" type="password" placeholder="合言葉">
    <button id="passphrase-submit">設定</button>
  </div>

  <button id="reset-partner">相手の設定をリセット</button>
  <button id="bulk-delete">自分の発言を全削除</button>
  <button id="toggle-log">アクセスログ表示</button>
  <br><br>
  <div id="access-log-panel"></div>
  <input id="search-input" type="text" placeholder="メッセージ検索">

  <div id="chat"></div>
  <div id="typing-indicator"></div>

  <div id="reply-preview">
    返信先: <span id="reply-preview-text"></span>
    <button id="reply-cancel">×</button>
  </div>

  <input id="input" type="text" placeholder="メッセージを入力">
  <button id="send">送信</button>

  <script>
    window.onerror = function(msg, url, line) {
      document.getElementById('error').textContent = 'エラー: ' + msg + ' (行:' + line + ')';
    };
    window.addEventListener('unhandledrejection', function(e) {
      document.getElementById('error').textContent = 'Promiseエラー: ' + (e.reason?.message || e.reason);
    });
  </script>
  <script src="main.js?v=18"></script>
</div>
</body>
</html>
